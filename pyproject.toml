[project]
name = "omg-specs-rag"
version = "0.1.0"
description = "RAG assistant for OMG specifications with citations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "flashrank>=0.2.10",
    "openai>=1.0.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
omg-fetch = "omg_specs_rag.fetch:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omg_specs_rag"]